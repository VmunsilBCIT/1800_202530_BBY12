<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="comp1800 template" content="My 1800 App" />
    <title>WaySync</title>
    <link rel="icon" type="image/png" href="./images/favicon.png" />
    <link rel="stylesheet" href="styles/style.css" />
    <!-- Web Components for shared navbar and footer -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>
  </head>

  <body>
    <!-- Main container -->

    <body>
      <div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
    </body>
    <div class="container py-5" style="max-width: 420px">
      <!-- Alerts -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login View -->
      <div id="loginView">
        <h2 class="auth-title">Login</h2>
        <form id="loginForm" novalidate>
          <input
            type="email"
            id="loginEmail"
            class="auth-input"
            placeholder="Email"
            required
          />
          <input
            type="password"
            id="loginPassword"
            class="auth-input"
            placeholder="Password"
            required
          />
          <button type="submit" class="auth-btn">Login</button>
        </form>
        <p class="auth-switch">
          Don't have an account? <a href="#" id="toSignup">Sign up!</a>
        </p>
      </div>

      <!-- Signup View -->
      <div id="signupView" class="d-none">
        <h2 class="auth-title">Sign up</h2>
        <form id="signupForm" novalidate>
          <input
            type="text"
            id="signupName"
            class="auth-input"
            placeholder="Name"
            required
          />
          <input
            type="email"
            id="signupEmail"
            class="auth-input"
            placeholder="Email"
            required
          />
          <input
            type="password"
            id="signupPassword"
            class="auth-input"
            placeholder="Password"
            required
          />
          <button type="submit" class="auth-btn">Sign up</button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="#" id="toLogin">Login!</a>
        </p>
      </div>
    </div>

    <!-- Footer (Web Component) -->
    <site-footer></site-footer>

    <!-- Scripts: load in correct order -->
    <script type="module" src="/src/firebaseConfig.js"></script>
    <script type="module" src="/src/authentication.js"></script>
    <script type="module" src="/src/loginSignup.js"></script>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
