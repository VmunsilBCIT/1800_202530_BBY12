<!DOCTYPE html>
<html lang="en">
  <head>
    <title>WaySync</title>
    <link rel="icon" type="image/png" href="./images/favicon.png" />
    <meta name="comp1800 BBY-12 WaySync" content="WaySync 1800 App" />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />

    <!-- Shared Components -->
    <script type="module" src="/src/components/site-navbar.js"></script>
    <script type="module" src="/src/components/site-footer.js"></script>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Mapbox CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
    <!-- Top Navbar -->
    <site-navbar></site-navbar>

    <!-- Background Waves -->
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>

    <!-- Main Map Section -->
    <main class="container-fluid p-0">
     <div id="map" style="width: 100%; height: 100dvh"></div>
    </main>
     <div class="ping-circle"></div>
      <!-- Ping button -->
      <button id="pingBtn" class="btn btn-light shadow-sm">
        Ping nearby Friends
      </button>
    </main>

    <!-- Bottom Footer -->
    <site-footer></site-footer>

    <!-- Mapbox JS & Custom Map Logic -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <script type="module" src="./src/map.js"></script>
  </body>
</html>
