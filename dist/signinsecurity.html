    <!-- Sign in security settings tab -->
    <div class="setting-container">
      <div class="settings-header">
        <span class="title">Sign-in Security</span>
      </div>
      <ul class="setting-list">
        <li>Email: <span id="user-email" class="arrow"></span></li>
        <li>
          Change Email
          <button id="change-email-btn" class="btn btn-primary btn-lg">

          </button>

          </button>
        </li>

    <div id="modalOverlay">
      <!--change password-->
      <div id="changePasswordContainer">
        <h3>Change Password</h3>

        <input
          type="password"
          id="currentPassword"
          placeholder="Current Password"
        />
        <input type="password" id="newPassword" placeholder="New Password" />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm New Password"
        />

        <div id="modalButtons">
          <button id="confirmPasswordBtn">Confirm</button>
          <button id="cancelPasswordBtn">Cancel</button>
        </div>
      </div>

      <!--change email-->
      <div id="EmailContainer">
        <h3>Change Email</h3>

        <input type="email" id="ChangeEmail" placeholder="New Email" />

        <div id="modalButtons">
          <button id="Confirm">Confirm</button>
