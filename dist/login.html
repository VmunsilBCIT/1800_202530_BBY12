      <div>

    <div class="container py-5" style="max-width: 420px">
      <!-- Alerts -->
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <!-- Login View -->
      <div id="loginView">
        <h2 class="auth-title">Login</h2>
        <form id="loginForm" novalidate>
          <input
            type="email"
            id="loginEmail"
            class="auth-input"
            placeholder="Email"
            required
          />
          <input
            type="password"
            id="loginPassword"
            class="auth-input"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-primary btn-lg">Login</button>
        </form>
        <p class="auth-switch">
          Don't have an account? <a href="#" id="toSignup">Sign up!</a>
        </p>
      </div>

      <!-- Signup View -->
      <div id="signupView" class="d-none">
        <h2 class="auth-title">Sign up</h2>
        <form id="signupForm" novalidate>
          <input
            type="text"
            id="signupName"
            class="auth-input"
            placeholder="Name"
            required
          />
          <input
            type="email"
            id="signupEmail"
            class="auth-input"
            placeholder="Email"
            required
          />
          <input
            type="password"
            id="signupPassword"
            class="auth-input"
            placeholder="Password"
            required
          />
          <button type="submit" class="btn btn-primary btn-lg">Sign up</button>
        </form>
        <p class="auth-switch">
          Already have an account? <a href="#" id="toLogin">Login!</a>
        </p>
      </div>
    </div>

    <site-footer></site-footer>
